name: Python quality gate

on:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  quality:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out development
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Detect Python source
        id: source
        shell: bash
        run: |
          if git ls-files -- '*.py' | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Python files are present yet; tests and the quality threshold will run when source code is pushed."
          fi

      - name: Install dependencies
        if: steps.source.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pylint pytest
          fi

      - name: Run tests
        if: steps.source.outputs.available == 'true'
        run: python -m pytest -q

      - name: Enforce Pylint score above 80%
        if: steps.source.outputs.available == 'true'
        shell: bash
        run: |
          mapfile -t python_files < <(git ls-files -- '*.py')
          python -m pylint --fail-under=8.01 "${python_files[@]}"
